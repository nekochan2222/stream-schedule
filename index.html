<style>
:root{--bg:#e4f2ff;--ac:#9DD2FE;--ac2:#cfe6fb;--dk:#4f86b8;--tx:#2b4660;--cr:#fbf3dc;--ln:#e1edf8}
*{box-sizing:border-box}

.chip.k{background:var(--ac);color:var(--tx)}
.chip.on{outline:2px solid var(--ac)}
