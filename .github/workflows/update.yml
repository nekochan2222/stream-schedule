name: update-streams
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '全件取得する(1)'
        default: ''
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node fetch.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          FULL: ${{ github.event.inputs.full }}
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update streams" && git push)
