<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信スケジュール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4f2ff;--ac:#9DD2FE;--ac2:#cfe6fb;--dk:#4f86b8;--tx:#2b4660;--cr:#fbf3dc;--ln:#e1edf8}
*{box-sizing:border-box}
body{margin:0;padding:12px;background:var(--bg);color:var(--tx);font-family:'Zen Maru Gothic',sans-serif;max-width:1100px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0}
.tabs button{border:0;background:#e9edf5;padding:8px 18px;font-weight:700;border-bottom:2px solid var(--ac2)}
.tabs button.on{background:var(--ac);color:var(--tx)}
.nav{display:flex;align-items:center;gap:8px;margin:12px 0}
.nav .rd{width:40px;height:40px;border-radius:50%;border:2px solid var(--ac2);background:none}
.nav b{font-size:20px;flex:1}
.nav .today{border:2px solid var(--ac2);background:#fff;border-radius:99px;padding:8px 18px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:0;border-radius:99px;padding:6px 14px;background:#fff;font-weight:700}
.chip.k{background:var(--ac);color:var(--tx)}
.chip.on{outline:2px solid var(--ac)}
.memo{background:var(--cr);background-image:linear-gradient(#0000 95%,#0001 0),linear-gradient(90deg,#0000 95%,#0001 0);background-size:16px 16px;border-radius:6px;padding:10px 12px;margin:10px 0;box-shadow:0 2px 6px #0002}
.memo div{display:flex;gap:10px;align-items:center;padding:3px 0}
.memo em{font-style:normal;background:var(--ac);color:var(--tx);border-radius:4px;padding:4px 10px;font-weight:700;white-space:nowrap}
.board{background:var(--ac2);border-radius:22px;padding:14px}
.paper{background:#fff;border-radius:14px;overflow:hidden}
.wk{display:grid;grid-template-columns:26px repeat(7,1fr)}
.wk .h{text-align:center;font-size:12px;padding:6px 0;border-bottom:2px solid var(--ac2);line-height:1.3}
.wk .h b{font-size:18px;display:block}
.hrs div{height:36px;font-size:11px;text-align:right;padding-right:4px;border-top:1px solid var(--ln)}
.col{position:relative;height:864px;border-left:1px dashed var(--ac2);background:repeating-linear-gradient(#0000 0 35px,var(--ln) 35px 36px)}
.blk{position:absolute;left:1px;right:1px;border-radius:8px;overflow:hidden;background:var(--ac) center/cover;color:#fff;font-size:11px;line-height:1.3;padding:3px;cursor:pointer;border:0;text-align:left}
.blk::before,.cell i::before{content:"";position:absolute;inset:0;background:#2b4660b0}
.blk span{position:relative;word-break:break-all}
.mo{display:grid;grid-template-columns:repeat(7,1fr)}
.mo .h{text-align:center;padding:6px;font-weight:700;border-bottom:2px solid var(--ac2)}
.cell{aspect-ratio:1;display:flex;flex-direction:column;position:relative;background:#f4f6fb;border:1px solid #fff}
.cell.now{outline:2px solid var(--ac);z-index:1}
.cell i{flex:1;position:relative;background:var(--ac) center/cover;cursor:pointer;min-height:0}
.cell i::before{background:#2b466040}
.cell u{position:absolute;right:3px;bottom:0;font-size:clamp(16px,4.5vw,30px);font-weight:700;color:#fff;text-decoration:none;text-shadow:0 0 4px #0008;pointer-events:none;z-index:2}
.cell.e u{color:var(--ac2);text-shadow:none}
.cell s{position:absolute;left:3px;top:2px;font-size:11px;color:#fff;font-weight:700;text-decoration:none;z-index:2;text-shadow:0 0 3px #000}
.list{display:flex;flex-direction:column;gap:8px;padding:10px}
.item{display:flex;gap:12px;align-items:center;border:1px solid var(--ln);border-radius:6px;padding:6px;background:#fff;text-align:left;width:100%}
.item img{width:90px;aspect-ratio:16/9;object-fit:cover;border-radius:4px}
.item small{color:#6b8199}
.ov{position:fixed;inset:0;background:#2b466080;display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
.ov.on{display:flex}
.card{background:var(--cr);border-radius:8px;padding:16px;width:min(460px,100%);max-height:90vh;overflow:auto}
.card img{width:100%;border-radius:6px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0}
.card dt{color:#6b8199}.card dd{margin:0}
.go{display:block;text-align:center;background:var(--ac);color:var(--tx);text-decoration:none;border-radius:99px;padding:12px;font-weight:700;margin:6px 0}
.tag{display:inline-block;background:var(--ac);color:var(--tx);border-radius:99px;padding:3px 12px;font-size:13px;margin-bottom:8px}
@media(max-width:600px){h1{font-size:15px}.blk{font-size:10px}}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><div class="tabs"><button data-m="week">週</button><button data-m="month">月</button></div></header>
<div class="nav"><button class="rd" id="prev">‹</button><b id="lbl"></b><button class="today" id="today">今日</button><button class="rd" id="next">›</button></div>
<div class="chips" id="stats"></div>
<div class="memo" id="memo"></div>
<div class="board"><div class="paper" id="main"></div></div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=[],C={},mode='week',cur=new Date(),game=null;
const B=s=>new Date(s.start);
const E=s=>new Date(s.end||(s.status==='live'?Date.now():+B(s)+36e5));
const d0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const add=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const hrs=s=>(E(s)-B(s))/36e5;
const r5=h=>Math.round(h*2)/2;
const tm=d=>d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');
const wd='日月火水木金土';
const own=()=>S.filter(s=>s.own);
const others=s=>S.filter(o=>!o.own&&B(o)<E(s)&&E(o)>B(s));
const bg=s=>`style="background-image:url('${esc(s.thumb)}')"`;

async function init(){
  C=await (await fetch('config.json')).json();
  S=await (await fetch('data/streams.json?'+Date.now())).json();
  $('#ttl').textContent=C.title;
  document.title=C.title;
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;game=null;render()});
  $('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
  $('#today').onclick=()=>{cur=new Date();game=null;render()};
  $('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('on')};
  render();
}
function shift(n){
  cur=mode==='week'?add(cur,7*n):new Date(cur.getFullYear(),cur.getMonth()+n,1);
  game=null;render();
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  let a,b;
  if(mode==='week'){
    a=add(d0(cur),-((cur.getDay()+6)%7));b=add(a,7);
    const z=add(b,-1);$('#lbl').textContent=`${a.getMonth()+1}/${a.getDate()} - ${z.getMonth()+1}/${z.getDate()}`;
  }else{
    a=new Date(cur.getFullYear(),cur.getMonth(),1);b=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    $('#lbl').textContent=`${cur.getFullYear()}年${cur.getMonth()+1}月`;
  }
  const L=own().filter(s=>B(s)>=a&&B(s)<b);
  // 統計(ゲーム別の時間をチップで表示。タップでゲーム別リスト)
  const g={};L.forEach(s=>{const k=s.game||'ほか';g[k]=(g[k]||0)+hrs(s)});
  const tot=L.reduce((x,s)=>x+hrs(s),0);
  $('#stats').innerHTML=`<span class="chip k">${L.length}回</span><span class="chip k">${r5(tot)}時間</span>`+
    Object.entries(g).sort((x,y)=>y[1]-x[1]).map(([k,v])=>`<button class="chip ${game===k?'on':''}" data-g="${esc(k)}">${esc(k)} ${r5(v)}h</button>`).join('');
  document.querySelectorAll('[data-g]').forEach(c=>c.onclick=()=>{game=game===c.dataset.g?null:c.dataset.g;render()});
  // 締切メモ
  const now=Date.now();
  $('#memo').innerHTML=(C.memos||[]).filter(m=>new Date(m.date)>now).sort((x,y)=>new Date(x.date)-new Date(y.date)).map(m=>{
    const d=new Date(m.date);
    return `<div><em>あと${Math.ceil((d-now)/864e5)}日</em><span><b>${esc(m.title)}</b><br><small>${d.getMonth()+1}/${d.getDate()}(${wd[d.getDay()]}) ${tm(d)}</small></span></div>`;
  }).join('')||'<small>締切メモはありません(config.json の memos に追加)</small>';
  $('#main').innerHTML=game?listView(game):mode==='week'?weekView(a):monthView(a,b);
  document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>openCard(e.dataset.id));
}
function weekView(a){
  let h='<div class="wk"><div></div>';
  const days=[...Array(7)].map((_,i)=>add(a,i));
  days.forEach(d=>{
    const sum=own().reduce((x,s)=>{const t=Math.max(B(s),d),u=Math.min(E(s),add(d,1));return x+Math.max(0,(u-t)/36e5)},0);
    h+=`<div class="h"><b>${d.getDate()}</b>${wd[d.getDay()]}<br>${sum?r5(sum)+'h':''}</div>`;
  });
  h+=`<div class="hrs">${[...Array(24)].map((_,i)=>`<div>${i}</div>`).join('')}</div>`;
  days.forEach(d=>{
    const e=add(d,1);
    h+='<div class="col">'+own().filter(s=>B(s)<e&&E(s)>d).map(s=>{
      const t=Math.max(B(s),d),u=Math.min(E(s),e);
      const top=(t-d)/36e5*36,ht=Math.max(18,(u-t)/36e5*36);
      return `<button class="blk" data-id="${s.id}" ${bg(s)} style="top:${top}px;height:${ht}px;background-image:url('${esc(s.thumb)}')"><span>${tm(B(s))} ${esc(s.title)}</span></button>`;
    }).join('')+'</div>';
  });
  return h+'</div>';
}
function monthView(a,b){
  let h='<div class="mo">'+'月火水木金土日'.split('').map(x=>`<div class="h">${x}</div>`).join('');
  const st=add(a,-((a.getDay()+6)%7));
  const today=d0(new Date()).getTime();
  for(let d=st;d<b||(d.getDay()!==1);d=add(d,1)){
    const inM=d>=a&&d<b;
    const L=inM?own().filter(s=>+d0(B(s))===+d):[];
    h+=`<div class="cell ${L.length?'':'e'} ${+d===today?'now':''}">`+
      (L.length?`<s>${r5(L.reduce((x,s)=>x+hrs(s),0))}h</s>`:'')+
      L.map(s=>`<i data-id="${s.id}" style="background-image:url('${esc(s.thumb)}')"></i>`).join('')+
      `<u>${inM?String(d.getDate()).padStart(2,'0'):''}</u></div>`;
  }
  return h+'</div>';
}
function listView(k){
  const L=own().filter(s=>(s.game||'ほか')===k).reverse();
  return '<div class="list">'+L.map(s=>`<button class="item" data-id="${s.id}"><img src="${esc(s.thumb)}"><span><small>${B(s).getFullYear()}/${B(s).getMonth()+1}/${B(s).getDate()}(${wd[B(s).getDay()]}) ${tm(B(s))}-${tm(E(s))} ・${r5(hrs(s))}h</small><br><b>${esc(s.title)}</b></span></button>`).join('')+'</div>';
}
function openCard(id){
  const s=S.find(x=>x.id===id),a=B(s),e=E(s);
  const co=s.own?others(s):[];
  const url=v=>'https://www.youtube.com/watch?v='+v.id;
  $('#card').innerHTML=
    `${s.game?`<span class="tag">${esc(s.game)}</span> `:''}${co.length?'<span class="tag" style="background:#fff;color:var(--dk)">コラボ</span>':''}`+
    `<img src="${esc(s.thumb)}"><h3>${esc(s.title)}</h3>`+
    `<dl><dt>日付</dt><dd>${a.getMonth()+1}/${a.getDate()}(${wd[a.getDay()]})</dd><dt>時間</dt><dd>${tm(a)} – ${tm(e)}</dd><dt>長さ</dt><dd>約${r5(hrs(s))}時間</dd><dt>配信元</dt><dd>${esc(s.channel)}</dd></dl>`+
    `<a class="go" href="${url(s)}" target="_blank" rel="noopener">${esc(s.channel)}の枠を開く ↗</a>`+
    (co.length?'<small>コラボ相手の枠</small>'+co.map(o=>`<a class="go" style="background:#fff;color:var(--tx)" href="${url(o)}" target="_blank" rel="noopener">${esc(o.channel)}: ${esc(o.title)}</a>`).join(''):'');
  $('#ov').classList.add('on');
}
init().catch(e=>{$('#main').innerHTML='<p style="padding:16px">data/streams.json がまだありません。Actions を一度実行してください。</p>'});
</script>
</body>
</html>
